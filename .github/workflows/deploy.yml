name: Deploy EduCode MVC

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: educode-mvc

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore src/EduCode.WebMVC/EduCode.WebMVC.csproj

      - name: Publish MVC
        run: |
          dotnet publish src/EduCode.WebMVC/EduCode.WebMVC.csproj \
            -c Release \
            -o publish \
            ---no-restore

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          IMAGE_URI="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME"
          docker build \
            -t $IMAGE_URI:${{ github.sha }} \
            -t $IMAGE_URI:latest \
            .
          docker push $IMAGE_URI:${{ github.sha }}
          docker push $IMAGE_URI:latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        run: |
          IMAGE_URI="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME"
          az containerapp update \
            --name educode-webmvc \
            --resource-group EduCode \
            --image $IMAGE_URI:${{ github.sha }}
