name: Deploy EduCode MVC

on:
  push:
    branches:
      - main

env:
  REGISTRY: educoderegistry.azurecr.io
  IMAGE_NAME: educode-mvc

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore src/EduCode.WebMVC/EduCode.WebMVC.csproj

      - name: Publish MVC
        run: |
          dotnet publish src/EduCode.WebMVC/EduCode.WebMVC.csproj \
            -c Release \
            -o publish \
            --no-restore

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name educoderegistry

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            -t $REGISTRY/$IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name educode-webmvc \
            --resource-group EduCode \
            --image $REGISTRY/$IMAGE_NAME:${{ github.sha }}